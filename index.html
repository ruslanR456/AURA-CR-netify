<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA CR | Tienda Oficial</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --aura-green: #2ecc71;
            --deep-green: #1b4d3e;
            --soft-white: #ffffff;
            --off-white: #f8faf9;
            --text-dark: #1a1a1a;
            --fav-pink: #ff4757;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--soft-white);
            color: var(--text-dark);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Nav & Branding */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--deep-green);
            text-decoration: none;
        }

        .nav-icons {
            display: flex;
            gap: 10px;
        }

        .btn-header {
            background: var(--deep-green);
            color: white;
            padding: 10px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-gal-header { background: var(--aura-green); }

        /* Hero */
        .hero {
            height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('Gemini_Generated_Image_qqr19uqqr19uqqr1.png');
            background-size: cover;
            background-position: center;
            margin-top: 60px;
            color: white;
            padding: 0 5%;
        }

        .hero h2 {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1.8rem, 6vw, 3.5rem);
            margin-bottom: 10px;
        }

        /* Top Bar Actions */
        .top-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 25px 5%;
            flex-wrap: wrap;
        }

        .action-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .wa { background: #25d366; color: white; }
        .ig { background: #ffffff; color: #e1306c; border: 1px solid #eee; }
        .gal { background: var(--deep-green); color: white; }

        /* Product Sections */
        .section-container { padding: 40px 5%; }
        .section-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: var(--deep-green);
            border-left: 4px solid var(--aura-green);
            padding-left: 15px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--off-white);
            border-radius: 20px;
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

        .image-box { width: 100%; height: 350px; overflow: hidden; background: #eee; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }

        .card-info { padding: 20px; text-align: center; }
        .card-name { font-weight: 800; font-size: 1rem; text-transform: uppercase; margin-bottom: 5px; }
        .card-price { color: var(--aura-green); font-weight: 800; font-size: 1.2rem; margin-bottom: 15px; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-p {
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
        }

        .p-wa { background: #25d366; color: white; }
        .p-ig { background: white; color: #e1306c; border: 1px solid #eee; }

        /* Full Gallery Modal */
        .gallery-modal {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 2000;
            display: none;
            flex-direction: column;
        }

        .modal-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            padding: 15px;
            overflow-y: auto;
        } 

        .modal-item { aspect-ratio: 1; border-radius: 8px; overflow: hidden; }
        .modal-item img { width: 100%; height: 100%; object-fit: cover; }

        .btn-header span { display: none; }
     

        /* Dropdown Menu */
        .dropdown {
            position: relative;
            display: inline-block;
        }

 }

        .dropbtn {
            background: var(--deep-green);
            color: white;
            padding: 10px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
        }
  
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 8px;
            overflow: hidden;
            top: 100%;
            right: 0;
        }

        .dropdown-content a {
            color: var(--deep-green);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .dropdown-content a:hover { background-color: var(--off-white); }

        .dropdown:hover .dropdown-content { display: block; }

        .specific-link{
          background-color: #25d366;
            height: 80px;
            width: auto;
            color: whitesmoke;
           
        }
     .hedentxt{
         visibility: hidden;
            position: absolute; /* This makes it invisible but still take up space */
            width: 0px;
            height: 0px;
            overflow: hidden;
            border: none;
          display: flex;
          margin-left: 5px;
     }
    
      
    </style>
    </style>
</head>
<body>

        <div class="nav-icons">

                </button>
                <div class="dropdown-content">
                    <a href="https://wa.me/573102229600">WhatsApp</a>
                    <a href="https://instagram.com/aura_cr.cr">Instagram</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero">

        <a href="https://wa.me/573102229600" class="action-link wa">

        </a>
        <a href="https://instagram.com/aura_cr.cr" class="action-link ig">

        <div class="product-grid" id="grid-shoes"></div>

    <section class="section-container" style="background: var(--off-white);">

    <!-- Modal Galería -->
    <div class="gallery-modal" id="galModal">
        <div class="modal-header">
            <span style="font-family:'Syncopate'; font-weight:700;">CATÁLOGO COMPLETO</span>

    <script>
        // Tus imágenes reales subidas para zapatos y ropa
        const myProducts = [
            { type: 'shoe', name: 'AURA CLASSIC WHITE', price: 38000, img: 'Screenshot_20260422_142217_Chrome.jpg' },
            { type: 'shoe', name: 'EMERALD SPORT', price: 42000, img: 'Screenshot_20260422_142252_Chrome.jpg' },

            { type: 'shoe', name: 'AURA LITE PINK', price: 35000, img: 'Screenshot_20260422_142319_Chrome.jpg' },
            { type: 'shoe', name: 'MINT REFRESH', price: 39000, img: 'Screenshot_20260422_142338_Chrome.jpg' },
           { type: 'clothe', name: 'Audifonos bluetooth', price: 14000, img: 'Screenshot_20260422_181054_Chrome.jpg' },
            { type: 'shoe', name: 'MINIMAL WHITE', price: 32000, img: 'Screenshot_20260422_142358_Chrome.jpg' },
            { type: 'clothe', name: 'AURA STRIKE', price: 41000, img: 'Screenshot_20260422_181027_Chrome.jpg' },
            { type: 'clothe', name: 'NIKE the negro pantalon y suter', price: 43000, img: 'Screenshot_20260422_181047_Chrome.jpg' },
            
            { type: 'clothe', name: 'pantalon JORDAN', price: 36000, img: 'Screenshot_20260422_181102_Chrome.jpg' },
            { type: 'shoe', name: 'MIXED BLACK', price: 37000, img: 'Screenshot_20260422_181114_Chrome.jpg' },
            { type: 'clothe', name: 'AURA JACKET ', price: 28000, img: 'Screenshot_20260422_180945_Chrome.jpg' },
            { type: 'clothe', name: 'AURA JACKET blanco', price: 28000, img: 'Screenshot_20260422_180947_Chrome.jpg' },
            { type: 'clothe', name: 'CLASSIC TEE del GYM', price: 18000, img: 'Screenshot_20260422_180956_Chrome.jpg' },
            { type: 'clothe', name: 'SUMMER STYLE', price: 22000, img: 'Screenshot_20260422_181006_Chrome.jpg' },
            { type: 'clothe', name: 'STREET DENIM', price: 32000, img: 'Screenshot_20260422_181015_Chrome.jpg' }
        ];

        function openGal() { 
            document.getElementById('galModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeGal() { 
            document.getElementById('galModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function init() {
            const shoeGrid = document.getElementById('grid-shoes');
            const clothesGrid = document.getElementById('grid-clothes');
            const modGrid = document.getElementById('modal-grid');
          

            myProducts.forEach(p => {
                const card = `
                    <div class="card">
                        <div class="image-box"><img src="${p.img}" alt="${p.name}"></div>
                        <div class="card-info">
                            <div class="card-name">${p.name}</div>
                            <div class="card-price">₡${p.price.toLocaleString()}</div>
                            <div class="btn-group">
                                <a href="https://wa.me/573102229600" class="btn-p p-wa">WhatsApp</a>
                                <a href="https://instagram.com/aura_cr.cr" class="btn-p p-ig">Instagram</a>
                            </div>
                        </div>
                    </div>
                `;

                if (p.type === 'shoe') {
                    shoeGrid.innerHTML += card;
                } else {
                    clothesGrid.innerHTML += card;
                }

                modGrid.innerHTML += `<div class="modal-item"><img src="${p.img}"></div>`;
            });
            lucide.createIcons();
        }

        window.onload = init;
    </script>
